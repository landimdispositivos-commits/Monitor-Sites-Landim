name: Monitor de sites

on:
  schedule:
    - cron: "*/5 * * * *" # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
    inputs:
      simular_queda:
        description: "Simular um site fora do ar (testa o e-mail de alerta)"
        type: boolean
        default: false

permissions:
  contents: write # renovação mensal (evita o GitHub desativar o agendamento)
  issues: write # alerta de queda = issue (o GitHub avisa por e-mail)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verificar sites
        env:
          SIMULATE_DOWN: ${{ inputs.simular_queda || 'false' }}
        run: bash check.sh

      - name: Abrir, atualizar ou fechar o alerta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const LABEL = "fora-do-ar";
            const now = new Date();
            const brt = (d) => d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
            const down = fs.readFileSync("down.txt", "utf8").trim().split("\n").filter(Boolean)
              .map((l) => { const [name, code, time] = l.split("|"); return { name, code, time }; });
            const names = down.map((d) => d.name).sort();
            const list = down.map((d) => `- **${d.name}**: código ${d.code === "000" ? "000 (sem resposta)" : d.code}`).join("\n");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // garante a etiqueta usada para achar o alerta aberto
            try { await github.rest.issues.getLabel({ ...context.repo, name: LABEL }); }
            catch { await github.rest.issues.createLabel({ ...context.repo, name: LABEL, color: "d73a4a", description: "Alerta automático de site fora do ar" }); }

            const open = (await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: LABEL, per_page: 1 })).data[0];

            if (down.length && !open) {
              const issue = await github.rest.issues.create({
                ...context.repo,
                title: `🔴 Fora do ar: ${names.join(", ")}`,
                labels: [LABEL],
                body: `**Detectado em ${brt(now)}** (horário de Brasília), após 3 tentativas sem resposta.\n\n${list}\n\n` +
                      `Este alerta será fechado automaticamente quando tudo voltar. [Detalhes da verificação](${run})`,
              });
              core.notice(`Alerta aberto: #${issue.data.number}`);
            } else if (down.length && open) {
              const previous = (open.title.split(": ")[1] || "").split(", ").sort().join(", ");
              if (previous !== names.join(", ")) {
                await github.rest.issues.update({ ...context.repo, issue_number: open.number, title: `🔴 Fora do ar: ${names.join(", ")}` });
                await github.rest.issues.createComment({ ...context.repo, issue_number: open.number,
                  body: `**${brt(now)}** — situação mudou:\n\n${list}\n\n[Detalhes](${run})` });
              }
            } else if (!down.length && open) {
              const minutes = Math.round((now - new Date(open.created_at)) / 60000);
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number,
                body: `🟢 **Tudo voltou ao ar em ${brt(now)}** (horário de Brasília). Tempo fora: cerca de **${minutes} min**.\n\n[Detalhes](${run})` });
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: "closed", state_reason: "completed" });
              core.notice(`Alerta #${open.number} fechado após ~${minutes} min`);
            }

      - name: Renovação mensal do agendamento
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 24 * 3600 )) ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "Renovação automática do agendamento" && git push
          fi
